trigger: none

pool: DevOps-Pool

steps:
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  displayName: Terraform Init
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(Build.SourcesDirectory)'
    backendServiceArm: 'yogi-svc'
    backendAzureRmResourceGroupName: 'yogi-stgrg'
    backendAzureRmStorageAccountName: 'storageyogi2345'
    backendAzureRmContainerName: 'yogi-ctr'
    backendAzureRmKey: 'yogi.tfstate'

- task: TerraformTask@5
  displayName: Terraform Plan
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(Build.SourcesDirectory)'
    environmentServiceNameAzureRM: 'yogi-svc'

- task: TerraformTask@5
  displayName: Terraform Apply
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(Build.SourcesDirectory)'
    commandOptions: '-auto-approve'
    environmentServiceNameAzureRM: 'yogi-svc'