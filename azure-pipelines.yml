trigger:
- main

pool:
  name: devops-pool

steps:
- task: TerraformInstaller@1
  displayName: 'Terraform Install'
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'Yogendra-SVC'
    backendAzureRmResourceGroupName: 'devops-rg'
    backendAzureRmStorageAccountName: 'devopsstorage09'
    backendAzureRmContainerName: 'devopscontainer09'
    backendAzureRmKey: 'yogi.tfstate'

- task: TerraformTask@5
  displayName: 'Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'Yogendra-SVC'

- task: TerraformTask@5
  displayName: 'Terraform Apply'
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: 'Yogendra-SVC'